components:
  schemas:
    AssetPriceDTO:
      required:
      - asOfDatetime
      - assetSymbol
      - price
      - priceSource
      - quoteCurrency
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        assetPriceId:
          type: string
          format: uuid
          readOnly: true
        assetSymbol:
          maxLength: 20
          minLength: 0
          pattern: "^[A-Z0-9]+$"
          type: string
        quoteCurrency:
          maxLength: 10
          minLength: 1
          pattern: "^[A-Z0-9]+$"
          type: string
        price:
          multipleOf: 0.000000000000000001
          maximum: 999999999999999999.999999999999999999
          minimum: 0
          exclusiveMinimum: true
          type: number
        asOfDatetime:
          type: string
          format: date-time
        priceSource:
          maxLength: 50
          minLength: 0
          type: string
    AccountStatusHistoryDTO:
      required:
      - accountId
      - statusCode
      - statusStartDatetime
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        accountStatusHistoryId:
          type: string
          format: uuid
          readOnly: true
        accountId:
          type: string
          format: uuid
        statusCode:
          type: string
          enum:
          - DRAFT
          - OPEN
          - SUSPENDED
          - CLOSED
          - DORMANT
        statusStartDatetime:
          type: string
          format: date-time
        statusEndDatetime:
          type: string
          format: date-time
        reason:
          maxLength: 500
          minLength: 0
          type: string
    AccountProviderDTO:
      required:
      - accountId
      - providerName
      - status
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        accountProviderId:
          type: string
          format: uuid
          readOnly: true
        accountId:
          type: string
          format: uuid
        providerName:
          maxLength: 100
          minLength: 0
          type: string
        externalReference:
          maxLength: 100
          minLength: 0
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - PENDING
          - SUSPENDED
        accountSpaceId:
          type: string
          format: uuid
    AccountParameterDTO:
      required:
      - accountId
      - effectiveDate
      - paramType
      - paramValue
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        accountParameterId:
          type: string
          format: uuid
          readOnly: true
        accountId:
          type: string
          format: uuid
        paramType:
          type: string
          enum:
          - MONTHLY_FEE
          - OVERDRAFT_LIMIT
          - INTEREST_RATE
        paramValue:
          minimum: 0.0
          exclusiveMinimum: false
          type: number
        paramUnit:
          maxLength: 20
          minLength: 0
          type: string
        effectiveDate:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
        description:
          maxLength: 500
          minLength: 0
          type: string
    AccountBalanceDTO:
      required:
      - accountId
      - asOfDatetime
      - balanceAmount
      - balanceType
      type: object
      properties:
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        dateUpdated:
          type: string
          format: date-time
          readOnly: true
        accountBalanceId:
          type: string
          format: uuid
          readOnly: true
        accountId:
          type: string
          format: uuid
        accountSpaceId:
          type: string
          format: uuid
        balanceType:
          type: string
          enum:
          - CURRENT
          - AVAILABLE
          - BLOCKED
          - STAKED
          - LOCKED
          - PENDING_CONFIRMATION
        balanceAmount:
          type: number
        asOfDatetime:
          type: string
          format: date-time
        assetSymbol:
          maxLength: 10
          minLength: 0
          pattern: "^[A-Z0-9]*$"
          type: string
        assetDecimals:
          maxLength: 2
          minLength: 0
          pattern: "^[0-9]*$"
          type: string
        transactionHash:
          maxLength: 100
          minLength: 0
          type: string
        confirmations:
          maximum: 999999
          minimum: 0
