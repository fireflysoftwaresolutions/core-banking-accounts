        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
          \ application idempotency."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetPriceDTO"
        required: true
      responses:
        "200":
          description: Asset price updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPriceDTO"
        "404":
          description: Asset price not found
      security:
      - assetPriceBearer: []
    delete:
      tags:
      - Asset Prices
      summary: Delete Asset Price
      description: Remove an existing asset price record by its unique identifier.
      operationId: deleteAssetPrice
      parameters:
      - name: assetPriceId
        in: path
        description: Unique identifier of the asset price to delete
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
