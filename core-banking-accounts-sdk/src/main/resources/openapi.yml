          example: 10
          default: 10
        example: 10
      - name: sortBy
        in: query
        description: The field to sort the results by.
        required: false
        schema:
          type: string
          description: The field to sort the results by.
          example: name
        example: name
      - name: sortDirection
        in: query
        description: "The direction of sorting, either ASC or DESC."
