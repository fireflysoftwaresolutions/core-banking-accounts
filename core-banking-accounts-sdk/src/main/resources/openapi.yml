  /api/v1/asset-prices/{assetPriceId}:
    get:
      tags:
      - Asset Prices
      summary: Get Asset Price by ID
      description: Retrieve a specific asset price by its unique identifier.
      operationId: getAssetPrice
      parameters:
      - name: assetPriceId
        in: path
        description: Unique identifier of the asset price
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
          \ application idempotency."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the asset price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPriceDTO"
        "404":
          description: Asset price not found
    put:
      tags:
      - Asset Prices
      summary: Update Asset Price
      description: Update an existing asset price record.
      operationId: updateAssetPrice
      parameters:
